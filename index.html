    <!-- Abertura (monograma escrito sobre a placa) toda vez que o site abre, inclusive no F5:
         recarregar volta para o topo (sem guardar a rolagem nem o #seção) e a escrita passa de novo.
         Pulam a abertura: link direto para uma peça (#p/...), link direto para uma seção
         (a página já abre lá embaixo) e "reduzir movimento" no aparelho.
         Se o script do site não rodar em 6,5 s, as seções aparecem sem efeito de entrada. -->
    <script>
      ;(function (h) {
        h.classList.add('js')
        var hash = location.hash
        var peca = /^#p\//.test(hash)
        var nav = window.performance && performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null
        if (nav && nav.type === 'reload' && !peca) {
          if ('scrollRestoration' in history) history.scrollRestoration = 'manual'
          if (hash) history.replaceState(null, '', location.pathname + location.search)
          hash = ''
        }
        var reduzir = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches
        if (peca || hash.length > 1 || reduzir) h.classList.add('sem-abertura')
        setTimeout(function () {
          if (!h.classList.contains('pronto')) h.classList.add('sem-efeitos')
        }, 6500)
      })(document.documentElement)
    </script>
